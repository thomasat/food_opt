<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="status.css">
<script src="status.js"></script>
</head>
<body>
<!-- The setup and error page both desktop shells show before the app.
     It holds no text: the shell passes its OS's messages in FOODOPT_BOOT
     and drives the page through window.FoodOpt (status.js). -->
<div id="steps-view" class="view" style="display:none">
  <h1 id="title"></h1>
  <ul id="steps" class="steps"></ul>
  <div id="barwrap" class="barwrap" style="display:none"><div id="bar" class="bar"></div></div>
  <p id="detail" class="detail"></p>
  <p id="note" class="note"></p>
  <p id="elapsed" class="elapsed"></p>
  <p id="nextup" class="nextup"></p>
  <p id="footer" class="footer"></p>
</div>
<div id="message-view" class="view" style="display:none">
  <h1 id="msg-title"></h1>
  <div id="msg-spinner" class="msg-spinner" style="display:none"></div>
  <p id="msg-step" class="msg-step" style="display:none"></p>
  <div id="msg-barwrap" class="msg-barwrap" style="display:none"><div id="msg-bar" class="msg-bar"></div></div>
  <div id="msg-slide" class="msg-slide" style="display:none"><div class="msg-slider"></div></div>
  <p id="msg-body" class="msg-body"></p>
  <p class="retry-row"><button id="retry" class="retry" type="button" style="display:none"></button></p>
  <p id="msg-footer" class="msg-footer"></p>
</div>
</body>
</html>
